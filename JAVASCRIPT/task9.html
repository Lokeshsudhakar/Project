<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Quiz</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f4ff, #ecebff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        .card {
            background: #fff;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
            text-align: center;
        }

        .hide {
            display: none;
        }

        /* Welcome */

        .icon,
        .resultIcon {
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 50%;
            background: #6c4cf1;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            margin-bottom: 20px;
        }

        .resultIcon {
            background: #2eaf41;
        }

        h1 {
            color: #35257f;
            margin-bottom: 15px;
        }

        .desc {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* Feature Boxes */

        .features {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 30px;
        }

        .feature {
            flex: 1;
            background: #faf9ff;
            border: 1px solid #ece8ff;
            border-radius: 12px;
            padding: 18px;
        }

        .feature i {
            color: #6c4cf1;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .feature h4 {
            margin-bottom: 6px;
        }

        .feature span {
            color: #777;
            font-size: 13px;
        }

        /* Buttons */

        button {
            border: none;
            border-radius: 8px;
            padding: 13px 28px;
            cursor: pointer;
            color: #fff;
            background: #6c4cf1;
            font-size: 16px;
            transition: .3s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: .95;
        }

        .gray {
            background: #ddd;
            color: #444;
        }

        .green {
            background: #2eaf41;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        /* Progress */

        .top {
            margin-bottom: 25px;
        }

        #progress {
            text-align: left;
            font-size: 14px;
            margin-bottom: 10px;
            color: #555;
        }

        .progressBar {
            width: 100%;
            height: 8px;
            background: #ececec;
            border-radius: 20px;
            overflow: hidden;
        }

        #progressFill {
            width: 10%;
            height: 100%;
            background: #6c4cf1;
            transition: .4s;
        }

        /* Question */

        #question {
            text-align: left;
            margin-bottom: 25px;
            color: #222;
        }

        /* Options */

        .option {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: .3s;
        }

        .option:hover {
            border-color: #6c4cf1;
            background: #f6f3ff;
        }

        .option input {
            margin-right: 12px;
        }

        .selected {
            background: #f3f0ff;
            border: 2px solid #6c4cf1;
        }

        /* Result Circle */

        .circle {
            width: 180px;
            height: 180px;
            margin: 30px auto;
            border-radius: 50%;
            border: 8px solid #2eaf41;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle h2 {
            font-size: 38px;
            color: #2eaf41;
        }

        .circle span {
            color: #666;
        }

        /* Result Boxes */

        .resultBoxes {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .box {
            flex: 1;
            padding: 20px;
            border-radius: 12px;
        }

        .box i {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .greenBox {
            background: #eaf8ed;
            color: #2eaf41;
        }

        .redBox {
            background: #fdecec;
            color: #e53935;
        }

        .blueBox {
            background: #eef3ff;
            color: #3366ff;
        }

        #message {
            margin-bottom: 20px;
            color: #444;
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- Welcome Screen -->

        <div id="welcomeScreen" class="card">

            <div class="icon">
                <i class="fa-solid fa-question"></i>
            </div>

            <h1>Welcome to the <br> JavaScript Quiz!</h1>

            <p class="desc">
                Test your JavaScript knowledge with
                10 multiple choice questions.
            </p>

            <div class="features">

                <div class="feature">
                    <i class="fa-solid fa-list"></i>
                    <h4>10</h4>
                    <span>Questions</span>
                </div>

                <div class="feature">
                    <i class="fa-regular fa-circle-check"></i>
                    <h4>Multiple</h4>
                    <span>Choice</span>
                </div>

                <div class="feature">
                    <i class="fa-solid fa-trophy"></i>
                    <h4>Test</h4>
                    <span>Your Knowledge</span>
                </div>

            </div>

            <button id="startBtn">
                Start Quiz
            </button>

        </div>



        <!-- Quiz Screen -->

        <div id="quizScreen" class="card hide">

            <div class="top">

                <p id="progress">
                    Question 1 of 10
                </p>

                <div class="progressBar">
                    <div id="progressFill"></div>
                </div>

            </div>


            <h2 id="question">
                Question
            </h2>

            <div id="options">

            </div>


            <div class="buttons">

                <button id="prevBtn" class="gray">
                    Previous
                </button>

                <button id="nextBtn">
                    Next
                </button>

                <button id="submitBtn" class="green hide">
                    Submit Quiz
                </button>

            </div>

        </div>





        <!-- Result Screen -->

        <div id="resultScreen" class="card hide">

            <div class="resultIcon">
                <i class="fa-solid fa-trophy"></i>
            </div>

            <h1>Quiz Completed!</h1>

            <p>Great job! Here are your results.</p>


            <div class="circle">

                <div>

                    <h2 id="scorePercent">
                        80%
                    </h2>

                    <span>Your Score</span>

                </div>

            </div>


            <div class="resultBoxes">

                <div class="box greenBox">

                    <i class="fa-solid fa-circle-check"></i>

                    <h3 id="correct">
                        0
                    </h3>

                    <p>Correct</p>

                </div>


                <div class="box redBox">

                    <i class="fa-solid fa-circle-xmark"></i>

                    <h3 id="wrong">
                        0
                    </h3>

                    <p>Wrong</p>

                </div>


                <div class="box blueBox">

                    <i class="fa-solid fa-list"></i>

                    <h3 id="total">
                        10
                    </h3>

                    <p>Total</p>

                </div>

            </div>


            <h3 id="message"></h3>

            <button id="restartBtn" class="green">
                Restart Quiz
            </button>

        </div>

    </div>

    <script>
        const quiz = [
            {
                question: "Which company developed JavaScript?",
                options: ["Netscape", "Microsoft", "Google", "Oracle"],
                answer: 0
            },
            {
                question: "Which keyword is used to declare a variable in JavaScript?",
                options: ["var", "let", "constant", "variable"],
                answer: 1
            },
            {
                question: "Which method converts JSON data into a JavaScript object?",
                options: ["JSON.parse()", "JSON.stringify()", "JSON.convert()", "JSON.object()"],
                answer: 0
            },
            {
                question: "Which symbol is used for single-line comments?",
                options: ["//", "/* */", "<!-- -->", "#"],
                answer: 0
            },
            {
                question: "Which operator checks both value and datatype?",
                options: ["==", "=", "===", "!="],
                answer: 2
            },
            {
                question: "Which HTML tag is used to include JavaScript?",
                options: ["javascript", "script", "js", "code"],
                answer: 1
            },
            {
                question: "Which event occurs when a button is clicked?",
                options: ["mouseover", "submit", "click", "keypress"],
                answer: 2
            },
            {
                question: "Which function displays data in the browser console?",
                options: ["print()", "console.log()", "display()", "echo()"],
                answer: 1
            },
            {
                question: "Which method selects an element by id?",
                options: [
                    "getElementById()",
                    "queryClass()",
                    "getElements()",
                    "selectId()"
                ],
                answer: 0
            },
            {
                question: "JavaScript is a ______ language.",
                options: [
                    "Programming",
                    "Database",
                    "Markup",
                    "Styling"
                ],
                answer: 0
            }
        ];

        let currentQuestion = 0;
        let answers = new Array(quiz.length).fill(null);

        // Elements
        const welcomeScreen = document.getElementById("welcomeScreen");
        const quizScreen = document.getElementById("quizScreen");
        const resultScreen = document.getElementById("resultScreen");

        const startBtn = document.getElementById("startBtn");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const submitBtn = document.getElementById("submitBtn");
        const restartBtn = document.getElementById("restartBtn");

        const question = document.getElementById("question");
        const options = document.getElementById("options");
        const progress = document.getElementById("progress");
        const progressFill = document.getElementById("progressFill");

        // Start Quiz
        startBtn.addEventListener("click", function () {
            welcomeScreen.classList.add("hide");
            quizScreen.classList.remove("hide");
            loadQuestion();
        });

        // Load Question
        function loadQuestion() {

            progress.innerHTML =
                "Question " + (currentQuestion + 1) + " of " + quiz.length;

            progressFill.style.width =
                ((currentQuestion + 1) / quiz.length) * 100 + "%";

            question.innerHTML = quiz[currentQuestion].question;

            options.innerHTML = "";

            for (let i = 0; i < quiz[currentQuestion].options.length; i++) {

                let option = document.createElement("div");

                option.className = "option";

                if (answers[currentQuestion] == i) {
                    option.classList.add("selected");
                }

                option.innerHTML =
                    `<input type="radio" name="answer"
            ${answers[currentQuestion] == i ? "checked" : ""}>
            ${quiz[currentQuestion].options[i]}`;

                option.addEventListener("click", function () {

                    answers[currentQuestion] = i;

                    loadQuestion();

                });

                options.appendChild(option);

            }

            prevBtn.disabled = currentQuestion == 0;

            if (currentQuestion == quiz.length - 1) {
                nextBtn.classList.add("hide");
                submitBtn.classList.remove("hide");
            } else {
                nextBtn.classList.remove("hide");
                submitBtn.classList.add("hide");
            }

        }

        // Next
        nextBtn.addEventListener("click", function () {

            if (currentQuestion < quiz.length - 1) {

                currentQuestion++;

                loadQuestion();

            }

        });

        // Previous
        prevBtn.addEventListener("click", function () {

            if (currentQuestion > 0) {

                currentQuestion--;

                loadQuestion();

            }

        });

        // Submit
        submitBtn.addEventListener("click", function () {

            let score = 0;

            for (let i = 0; i < quiz.length; i++) {

                if (answers[i] == quiz[i].answer) {

                    score++;

                }

            }

            let wrong = quiz.length - score;

            let percentage = Math.round((score / quiz.length) * 100);

            quizScreen.classList.add("hide");

            resultScreen.classList.remove("hide");

            document.getElementById("scorePercent").innerHTML =
                percentage + "%";

            document.getElementById("correct").innerHTML = score;

            document.getElementById("wrong").innerHTML = wrong;

            document.getElementById("total").innerHTML = quiz.length;

            let msg = "";

            if (percentage >= 90) {

                msg = "🏆 Excellent!";

            }
            else if (percentage >= 70) {

                msg = "🎉 Great Job!";

            }
            else if (percentage >= 50) {

                msg = "👍 Good Effort!";

            }
            else {

                msg = "📚 Keep Practicing!";

            }

            document.getElementById("message").innerHTML = msg;

       

        });

        // Restart
        restartBtn.addEventListener("click", function () {

            currentQuestion = 0;

            answers = new Array(quiz.length).fill(null);

            resultScreen.classList.add("hide");

            welcomeScreen.classList.remove("hide");

        });
    </script>

</body>

</html>
