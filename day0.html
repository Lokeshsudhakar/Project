<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 40px;
            margin: 0;
            background-color: #f0f4f8;
        }

        .line-slide {
            width: 100px;
            height: 5px;
            background-color: #02212c;
            animation: slide 1.2s linear infinite;
            border-radius: 2px;
        }

        @keyframes slide {
            from 0% {
                transform: translateX(0);
            }
            50% {
                transform: translateX(200px);
            }
            100% {
                transform: translateX(0);
            }
        }

        .bounce-box {
            width: 180px;
            height: 120px;
            background-color: #ffd166;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-weight: bold;
            border-radius: 16px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
            animation: bounce 1.5s ease-in infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-16px);
            }
            60% {
                transform: translateY(-8px);
            }
        }

        .card {
            width: 240px;
            height: 300px;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.16);
            background-image: linear-gradient(135deg, #7b9fff 0%, #4f6dff 100%);
            color: white;
        }

        .card-content {
            padding: 24px;
            position: relative;
            z-index: 1;
        }

        .card h2 {
            margin: 0 0 10px;
            font-size: 1.4rem;
        }

        .card p {
            margin: 0;
            line-height: 1.6;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.55);
            visibility: hidden;
            transition: visibility 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            padding: 16px;
        }

        .card:hover .overlay {
            visibility: visible;
        }
    </style>
</head>
<body>
    <div class="line-slide"></div>

    <div class="bounce-box">Bounce Box</div>

    <div class="card">
        <div class="card-content">
            <h2>Hover Card</h2>
        </div>
        <div class="overlay">Overlay Active on Hover</div>
    </div>
</body>
</html>
